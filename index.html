 return Array.from({length:n},(_,i)=>{const fa=i==n-1?1:.94+rn(i+3)*.12,v=fa*tD*sc,tn=k.cap*fa*shs;return kind=='elec'?[addD(TODAY,i-n+1),Math.round(v),Math.round(v*1000/tn),+(v/24*1.12).toFixed(1),Math.round(v*1000*S.tariff)]:[addD(TODAY,i-n+1),Math.round(v),Math.round(v/tn),+(21-(S.gasCut||0)*.12+(rn(i+9)-.5)*.4).toFixed(1),Math.round(v*gasEGP())]})}

function elecAlerts(){const k=K(),pk=peakMW(),a=[];if(pk>S.dlim)a.push(['el:peak','Critical','Peak demand '+f(pk,1)+' MW exceeds the '+S.dlim+' MW contract limit','Shed non-critical loads or shift rolling-mill load','#energy/elec']);else if(pk>S.dlim*.95)a.push(['el:peak','Warning','Peak demand '+f(pk,1)+' MW is within 5% of the '+S.dlim+' MW limit','Prepare load shedding','#energy/elec']);if(S.pf<.9)a.push(['el:pf','Warning','Power factor '+S.pf.toFixed(2)+' is below 0.90, a penalty applies','Check capacitor banks','#energy/elec']);if(k.kwhT>600)a.push(['el:int','Warning','Electricity intensity '+f(k.kwhT)+' kWh/t is above the 560 baseline','Check furnace and mill loads and unplanned stops','#energy/elec']);if(S.tariff>3)a.push(['el:tar','Warning','Tariff EGP '+S.tariff.toFixed(2)+'/kWh is above EGP 3.00','Review load shifting and demand limits','#energy/elec']);if(S.fail)a.push(['el:idle','Warning','Auxiliary loads keep running while '+S.fail+' is down (about '+f(pk*.04,1)+' MW)','Switch off idle fans, pumps and compressors','#energy/elec']);return a}
function gasAlerts(){const u=gasDay()/MDQ,a=[];if(S.gasCut>0)a.push(['gs:cut','Critical','Gas supply curtailed by '+S.gasCut+'%: DRI output and plant capacity are derated','Confirm supply schedule and reprioritise orders','#energy/gas']);if(u>1)a.push(['gs:mdq','Critical','Gas use is '+f(u*100)+'% of the contract maximum daily quantity','Reduce gas load or negotiate extra quantity','#energy/gas']);else if(u>.9)a.push(['gs:mdq','Warning','Gas use is '+f(u*100)+'% of the contract maximum daily quantity','Plan for peak days','#energy/gas']);if(S.gasLoss>2)a.push(['gs:leak','Warning','Estimated gas loss '+S.gasLoss+'% (EGP '+f(gasDay()*S.gasLoss/100*gasEGP())+' per day)','Run a leak survey on the DRI piping','#energy/gas']);if(S.gasP>8)a.push(['gs:price','Warning','Gas price USD '+S.gasP+'/MMBtu is above USD 8','Review hedging and contract terms','#energy/gas']);if(S.fail)a.push(['gs:int','Info','Gas intensity is '+f(gasT())+' Nm³/t, 3% above baseline during the stoppage','Restore the line to normal throughput','#energy/gas']);return a}

function ELEC(){const k=K(),D=eData('elec'),F=S.ef,pk=peakMW(),sc=D.ps*D.sh,hr=Array.from({length:24},(_,h)=>Math.round(k.daily*sc/24*(1+.12*Math.sin(h/24*6.28-1)+(h%7==3?.08:0)))),en=D.tot*1000*S.tariff,eDay=k.daily*1000*S.tariff,dDay=pk*1000*S.dch/30,pen=S.pf<.9?eDay*(.9-S.pf)*100*.005:0,tot=eDay+dDay+pen;
 return card('Electricity management',`<p class="tag">Simulated meters, not real SCADA</p>`+fbar('elec')+kp([[f(D.tot)+' MWh','consumption ('+F.per.toLowerCase()+', filtered)'],[f(k.kwhT*D.ps)+' kWh/t','electricity intensity'],[f(pk,1)+' MW','peak demand · '+f(pk/S.dlim*100)+'% of '+S.dlim+' MW limit'],[S.pf.toFixed(2),'power factor'],['EGP '+f(en),'energy charge ('+F.per.toLowerCase()+')'],['EGP '+f(k.kwhT*S.tariff*D.ps)+'/t','electricity cost per tonne']])+`<div class="dk" style="margin:12px 0"><div style="display:flex;gap:22px;flex-wrap:wrap;align-items:end"><div><span class="num" id="lv-mw2" style="font-size:42px;color:#ffb25a">-</span><br><small style="color:#8b9aab">live demand (simulated)</small></div><div><span class="num" style="font-size:28px" id="lv-cost">-</span><br><small style="color:#8b9aab">EGP per hour</small></div><div style="flex:1;min-width:240px">${svgh('p','#ff7a1a',70)}</div></div></div>`+'<h3>Costs and assumptions</h3>'+sl('Energy tariff (EGP/kWh)','tariff',1,4,.05,S.tariff,v=>(+v).toFixed(2))+sl('Demand charge (EGP/kW-month)','dch',20,120,1,S.dch,v=>v)+sl('Contract demand limit (MW)','dlim',100,180,1,S.dlim,v=>v+' MW')+sl('Power factor','pf',.8,1,.01,S.pf,v=>(+v).toFixed(2))+tbl(['Cost item (full plant, per day)','EGP','Note'],[['Energy charge',f(eDay),'Included in production cost (Finance & Maintenance)'],['Demand charge',f(dDay),'Peak '+f(pk,1)+' MW × '+S.dch+' EGP/kW-month ÷ 30; reported here only'],['Power-factor penalty',f(pen),S.pf<.9?'0.5% per 0.01 below 0.90':'None, power factor is 0.90 or higher'],['Total electricity bill',f(tot),'EGP '+f(tot/Math.max(1,k.cap))+' per tonne']])+'<h3>24-hour load profile (MWh/h, filtered)</h3>'+cols([hr],hr.map((v,i)=>i),['var(--acc)'])+(D.n>1?'<h3>Daily consumption (MWh)</h3>'+cols([D.rows.map(r=>r[1])],D.rows.map(r=>r[0].slice(5)),['#7dcfff']):'')+'<h3>Load by process</h3>'+hb(EP.filter(p=>F.proc=='All'||p[0]==F.proc).map(p=>[p[0],p[1],.55,f(k.daily*p[1]*D.sh)+' MWh/day'])) +'<h3>Electricity alerts</h3>'+alBlk(elecAlerts())+'<h3>Electricity reports</h3>'+repBlk('elec',D),'Filters apply to the KPIs, charts and report below.')}
function GAS(){const k=K(),D=eData('gas'),F=S.gf,u=gasDay()/MDQ,sc=D.ps*D.sh,hr=Array.from({length:24},(_,h)=>Math.round(gasDay()*sc/24*(1+.05*Math.sin(h/24*6.28-1)))),cDay=gasDay()*gasEGP(),loss=gasDay()*S.gasLoss/100*gasEGP(),bar=21-(S.gasCut||0)*.12;
 return card('Gas management',`<p class="tag">Simulated meters, not real SCADA or gas network data</p>`+fbar('gas')+kp([[f(D.tot/1000)+' k Nm³','consumption ('+F.per.toLowerCase()+', filtered)'],[f(gasT()*D.ps)+' Nm³/t','gas intensity'],['EGP '+f(gasCostT())+'/t','gas cost per tonne'],['EGP '+f(D.tot*gasEGP()/1e6,2)+' M','gas cost ('+F.per.toLowerCase()+')'],[f(bar,1)+' bar','supply pressure'],[f(u*100)+'%','of contract max daily quantity']])+`<div class="dk" style="margin:12px 0"><div style="display:flex;gap:22px;flex-wrap:wrap;align-items:end"><div><span class="num" id="gs-flow" style="font-size:38px;color:#ffb25a">-</span><br><small style="color:#8b9aab">live gas flow (simulated)</small></div><div><span class="num" style="font-size:26px" id="gs-cost">-</span><br><small style="color:#8b9aab">gas cost</small></div><div style="flex:1;min-width:240px">${svgh('g','#e0af68',70)}</div></div></div>`+'<h3>Costs and assumptions</h3>'+sl('Gas price (USD/MMBtu)','gasP',3,12,.05,S.gasP,v=>(+v).toFixed(2))+sl('Supply curtailment (%)','gasCut',0,50,1,S.gasCut,v=>v+'%')+sl('Estimated gas loss (%)','gasLoss',0,6,.1,S.gasLoss,v=>(+v).toFixed(1)+'%')+tbl(['Cost item (full plant, per day)','Value','Note'],[['Gas price',f(gasEGP(),2)+' EGP/Nm³','USD '+S.gasP+'/MMBtu at USD/EGP '+S.fx+', 29.5 Nm³ per MMBtu (assumed)'],['Gas cost',f(cDay)+' EGP','Included in production cost (Finance & Maintenance)'],['Estimated gas loss',f(loss)+' EGP','Loss assumption '+S.gasLoss+'%'],['Gas cost per tonne',f(gasCostT())+' EGP/t',f(gasT())+' Nm³/t']])+'<h3>Supply and availability</h3>'+tbl(['Source','Max daily quantity','Today','Pressure','Availability','Backup fuel'],[['National grid pipeline',f(MDQ)+' Nm³',f(gasDay())+' Nm³ ('+f(u*100)+'%)',f(bar,1)+' bar',f(100-(S.gasCut||0),1)+'%','LPG storage 62% (demo)']])+'<h3>24-hour gas profile (Nm³/h, filtered)</h3>'+cols([hr],hr.map((v,i)=>i),['#e0af68'])+(D.n>1?'<h3>Daily consumption (Nm³)</h3>'+cols([D.rows.map(r=>r[1])],D.rows.map(r=>r[0].slice(5)),['#7dcfff']):'')+'<h3>Gas by process</h3>'+hb(GP.filter(p=>F.proc=='All'||p[0]==F.proc).map(p=>[p[0],p[1],.9,f(gasDay()*p[1]*D.sh)+' Nm³/day','#e0af68']))+'<h3>Gas alerts</h3>'+alBlk(gasAlerts())+'<h3>Gas reports</h3>'+repBlk('gas',D),'Gas price follows the shared USD/EGP rate; curtailment derates plant capacity everywhere.')}
